<title>NOON Shipping App</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Urbanist:wght@400;500;600;700;800&family=Cairo:wght@400;600;700;800&display=swap">
<style>
  /* Layout: one interactive phone on a neutral stage. Arabic (RTL, default) and English (LTR) share one dictionary-driven UI; panes slide like a native navigator, tabs sit in a liquid-bubble bar, brand red is the only accent. */
  :root{
    --stage:#D8D5D2; --stage-ink:#1B1B1D; --stage-sub:#5E5C5A;
    --screen:#F3F2F1; --card:#FFFFFF; --card-2:#ECEAE8; --line:rgba(27,27,29,.09);
    --ink:#1B1B1D; --sub:#6B6A6C; --faint:#A3A1A2;
    --accent:#D40511; --accent-ink:#FFFFFF; --accent-text:#D40511; --accent-soft:rgba(212,5,17,.12);
    --ok:#1E8E4A; --ok-soft:rgba(30,142,74,.14); --star:#F2A20C;
    --frame:#161617; --shadow:0 30px 56px -26px rgba(40,30,25,.5);
    --map-bg:#E6E3E0; --map-line:rgba(27,27,29,.08); --map-land:#DAD6D2; --map-route:#B9B5B1;
    --sky-1:#F6D9D4; --sky-2:#E8564F; --sky-3:#8E0B14; --sea-1:#5B1017; --sea-2:#2A0A0E;
    --font:"Urbanist","Segoe UI",-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;
  }
  :root[lang="ar"]{ --font:"Cairo","Urbanist","Segoe UI",Tahoma,Arial,sans-serif; }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --stage:#0B0B0C; --stage-ink:#F2F2F3; --stage-sub:#97969A;
      --screen:#121213; --card:#202022; --card-2:#2B2B2E; --line:rgba(255,255,255,.08);
      --ink:#F2F2F3; --sub:#A2A1A6; --faint:#6E6D72;
      --accent-text:#FF5560; --accent-soft:rgba(255,85,96,.16); --ok:#4CC38A; --ok-soft:rgba(76,195,138,.16); --star:#FFC247;
      --frame:#2A2A2C; --shadow:0 30px 56px -24px rgba(0,0,0,.85);
      --map-bg:#19191B; --map-line:rgba(255,255,255,.06); --map-land:#232326; --map-route:#4A4A4F;
      --sky-1:#4A1418; --sky-2:#B3101B; --sky-3:#14080A; --sea-1:#2A0A0E; --sea-2:#0C0405;
      color-scheme:dark;
    }
  }
  :root[data-theme="dark"]{
    --stage:#0B0B0C; --stage-ink:#F2F2F3; --stage-sub:#97969A;
    --screen:#121213; --card:#202022; --card-2:#2B2B2E; --line:rgba(255,255,255,.08);
    --ink:#F2F2F3; --sub:#A2A1A6; --faint:#6E6D72;
    --accent-text:#FF5560; --accent-soft:rgba(255,85,96,.16); --ok:#4CC38A; --ok-soft:rgba(76,195,138,.16); --star:#FFC247;
    --frame:#2A2A2C; --shadow:0 30px 56px -24px rgba(0,0,0,.85);
    --map-bg:#19191B; --map-line:rgba(255,255,255,.06); --map-land:#232326; --map-route:#4A4A4F;
    --sky-1:#4A1418; --sky-2:#B3101B; --sky-3:#14080A; --sea-1:#2A0A0E; --sea-2:#0C0405;
    color-scheme:dark;
  }

  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body{
    margin:0; background:var(--stage); color:var(--stage-ink); font-family:var(--font);
    padding-block:32px 56px;
    padding-left:max(16px, env(safe-area-inset-left, 0px));
    padding-right:max(16px, env(safe-area-inset-right, 0px));
    display:flex; flex-direction:column; align-items:center; gap:22px; min-height:100vh;
  }
  button, input{ font-family:inherit; }
  .top{ display:flex; flex-wrap:wrap; align-items:center; justify-content:center; gap:12px 16px; }
  .top h1{ margin:0; font-size:20px; font-weight:800; letter-spacing:-.01em; }
  :root[lang="ar"] .top h1{ letter-spacing:0; }
  .seg{ position:relative; display:inline-flex; padding:3px; border-radius:999px; background:var(--card-2); border:1px solid var(--line); }
  .seg .thumb{ position:absolute; left:0; top:3px; bottom:3px; width:0; border-radius:999px; background:var(--accent); pointer-events:none; }
  .seg.rdy .thumb{ transition:transform .45s cubic-bezier(.34,1.35,.5,1), width .35s ease; }
  .seg button{ position:relative; z-index:1; appearance:none; border:0; background:transparent; color:var(--sub); font-size:12.5px; font-weight:700; padding:7px 15px; border-radius:999px; cursor:pointer; transition:color .25s; }
  .seg button[aria-pressed="true"]{ color:var(--accent-ink); }
  .jump{ display:flex; flex-wrap:wrap; justify-content:center; gap:6px; max-width:420px; }
  .jump button{ appearance:none; border:1px solid var(--line); background:transparent; color:var(--stage-sub); font-size:11.5px; font-weight:700; padding:5px 11px; border-radius:999px; cursor:pointer; }
  .jump button:hover{ color:var(--stage-ink); border-color:var(--stage-sub); }
  button:focus-visible, [role="button"]:focus-visible, input:focus-visible{ outline:2px solid var(--accent-text); outline-offset:2px; }

  .phone{ position:relative; width:min(344px,100%); height:700px; border-radius:46px; padding:10px; background:var(--frame); box-shadow:var(--shadow); flex:0 0 auto; }
  .phone::before{ content:""; position:absolute; top:18px; left:50%; width:92px; height:24px; margin-left:-46px; border-radius:14px; background:var(--frame); z-index:60; box-shadow:0 0 0 3px var(--screen); }
  .scw{ position:absolute; inset:10px; border-radius:37px; overflow:hidden; isolation:isolate; --k:.84; }
  .screen{ --rd:1; position:relative; width:calc(100% / var(--k)); height:calc(100% / var(--k)); transform:scale(var(--k)); transform-origin:0 0; border-radius:0; overflow:hidden; background:var(--screen); color:var(--ink); isolation:isolate; }
  .screen[dir="rtl"]{ line-height:1.4; }
  .screen[dir="rtl"] *{ letter-spacing:0 !important; }
  .screen[dir="rtl"] .h1, .screen[dir="rtl"] .ob-slide h2{ line-height:1.25; }
  .screen[dir="rtl"] .ob-slide h2{ font-size:28px; }
  .screen[dir="rtl"] .flip, .screen[dir="rtl"] .route .rl svg{ scale:-1 1; }
  .screen[dir="rtl"] input[dir="ltr"]{ text-align:right; }
  bdi{ unicode-bidi:isolate; }

  /* panes + navigation motion (offsets follow reading direction through --rd) */
  .pane{ position:absolute; inset:0; display:flex; flex-direction:column; background:var(--screen); visibility:hidden; opacity:0;
    transition:transform .42s cubic-bezier(.22,.9,.24,1), opacity .32s ease, visibility 0s linear .42s; }
  .pane[data-s="a"]{ visibility:visible; opacity:1; transform:none; transition-delay:0s; z-index:2; }
  .pane[data-s="r"]{ transform:translateX(calc(44px * var(--rd,1))) scale(.985); }
  .pane[data-s="l"]{ transform:translateX(calc(-44px * var(--rd,1))) scale(.985); }
  .pane.nt{ transition:none !important; }
  .body{ flex:1; min-height:0; overflow-y:auto; padding:54px 16px 20px; display:flex; flex-direction:column; gap:12px; scrollbar-width:none; }
  .body::-webkit-scrollbar{ display:none; }
  .tabbed .body{ padding-bottom:104px; }
  .pane.play .body > *, .pane.play .stag > *{ animation:up .5s cubic-bezier(.2,.8,.2,1) both; animation-delay:calc(var(--n,0) * 55ms + 90ms); }
  @keyframes up{ from{ opacity:0; transform:translateY(14px); } to{ opacity:1; transform:none; } }
  .screen.lsw .pane[data-s="a"] .body, .screen.lsw .pane[data-s="a"] .ob-view, .screen.lsw .pane[data-s="a"] .login-body, .screen.lsw .pane[data-s="a"] .ob-foot{ animation:lfade .5s ease both; }
  .screen.lsw .ob-track{ transition:none !important; }
  @keyframes lfade{ from{ opacity:0; filter:blur(4px); transform:scale(.985); } to{ opacity:1; filter:none; transform:none; } }

  /* shared pieces */
  svg.ic{ width:18px; height:18px; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; flex:0 0 auto; }
  .pill{ display:inline-flex; align-items:center; font-size:10px; font-weight:700; padding:4px 9px; border-radius:999px; background:var(--accent-soft); color:var(--accent-text); white-space:nowrap; }
  .pill.quiet{ background:var(--card-2); color:var(--sub); } .pill.ok{ background:var(--ok-soft); color:var(--ok); } .pill.on-red{ background:rgba(255,255,255,.22); color:#fff; }
  .pill.live::before{ content:""; width:6px; height:6px; border-radius:50%; background:currentColor; margin-inline-end:6px; animation:blink 1.4s ease-in-out infinite; }
  @keyframes blink{ 0%,100%{ box-shadow:0 0 0 0 currentColor; opacity:1; } 50%{ opacity:.35; } 70%{ box-shadow:0 0 0 5px transparent; } }
  .card{ position:relative; background:var(--card); border-radius:20px; padding:14px; border:1px solid var(--line); }
  .card.red{ background:var(--accent); color:#fff; border-color:transparent; overflow:hidden; }
  .card.red::after{ content:""; position:absolute; top:0; bottom:0; width:55%; inset-inline-start:-80%; background:linear-gradient(100deg, transparent, rgba(255,255,255,.2), transparent); transform:skewX(-18deg); pointer-events:none; animation:sheen 5s ease-in-out 1.4s infinite; }
  @keyframes sheen{ 0%{ inset-inline-start:-80%; } 38%,100%{ inset-inline-start:150%; } }
  .card.fresh::before{ content:""; position:absolute; inset:-3px; border-radius:23px; border:2px solid var(--accent); pointer-events:none; animation:freshring 2.2s ease-out .5s both; }
  @keyframes freshring{ 0%{ opacity:0; transform:scale(.97); } 18%{ opacity:1; transform:scale(1); } 100%{ opacity:0; transform:scale(1.045); } }
  .card[data-open]{ cursor:pointer; transition:transform .18s ease; } .card[data-open]:active{ transform:scale(.975); }
  .row{ display:flex; align-items:center; justify-content:space-between; gap:8px; }
  .idg{ display:flex; align-items:center; gap:10px; min-width:0; }
  .oid{ font-size:14.5px; font-weight:800; letter-spacing:.01em; }
  small.s{ display:block; font-size:10px; color:var(--faint); font-weight:600; } .red small.s{ color:rgba(255,255,255,.75); }
  .kv{ display:grid; grid-template-columns:1fr 1fr; gap:8px 10px; margin-top:10px; }
  .kv small{ display:block; font-size:10px; color:var(--faint); font-weight:600; } .kv b{ display:block; font-size:12px; font-weight:700; margin-top:1px; }
  .red .kv small{ color:rgba(255,255,255,.75); }
  .chip-btn{ width:38px; height:38px; border-radius:50%; background:var(--card); border:1px solid var(--line); display:grid; place-items:center; color:var(--ink); flex:0 0 auto; cursor:pointer; transition:transform .15s; }
  .chip-btn:active{ transform:scale(.9); }
  .h1.one, .screen[dir="rtl"] .h1.one{ font-size:19px; white-space:nowrap; line-height:1.2; }
  .h1{ margin:0; font-size:24px; font-weight:800; letter-spacing:-.02em; line-height:1.05; }
  .topbar{ display:flex; align-items:center; gap:10px; } .topbar h3{ margin:0; flex:1; text-align:center; font-size:14.5px; font-weight:700; margin-inline-end:38px; }
  .mi{ width:34px; height:34px; border-radius:11px; display:grid; place-items:center; background:var(--accent-soft); color:var(--accent-text); flex:0 0 auto; }
  .mi svg{ width:17px; height:17px; }
  .route{ display:flex; align-items:center; gap:8px; margin-top:12px; font-size:13px; }
  .route b{ font-weight:800; } .route .rl{ flex:1; height:0; border-top:2px dashed var(--card-2); position:relative; }
  .red .route .rl{ border-color:rgba(255,255,255,.35); }
  .route .rl i{ position:absolute; inset-inline-start:0; top:-2px; height:2px; width:0; border-radius:2px; background:var(--accent); }
  .red .route .rl i{ background:#fff; }
  .route .rl svg{ position:absolute; inset-inline-start:0; margin-inline-start:-9px; top:-10px; width:18px; height:18px; background:var(--card); color:var(--accent-text); } .red .route .rl svg{ background:var(--accent); color:#fff; }
  .pane.play .route .rl i{ animation:rgrow 1.2s cubic-bezier(.2,.8,.2,1) .4s forwards; } @keyframes rgrow{ to{ width:var(--w); } }
  .pane.play .route .rl svg{ animation:travel 1.2s cubic-bezier(.2,.8,.2,1) .4s forwards; } @keyframes travel{ to{ inset-inline-start:var(--w); } }
  .btn{ display:flex; align-items:center; justify-content:center; gap:8px; height:48px; border-radius:999px; border:0; background:var(--accent); color:#fff; font-size:14px; font-weight:800; cursor:pointer; width:100%; transition:transform .15s; }
  .btn:active{ transform:scale(.97); } .btn.ghost{ background:var(--card); color:var(--ink); border:1px solid var(--line); }
  .btn .spin{ width:16px; height:16px; border-radius:50%; border:2px solid rgba(255,255,255,.4); border-top-color:#fff; animation:rot .7s linear infinite; display:none; }
  .btn.loading .spin{ display:block; } @keyframes rot{ to{ transform:rotate(360deg); } }
  .field{ display:flex; flex-direction:column; gap:6px; } .field label{ font-size:11px; font-weight:700; color:var(--sub); }
  .field input{ height:46px; border-radius:999px; border:1px solid var(--line); background:var(--card); color:var(--ink); padding:0 16px; font-size:14px; outline-offset:2px; width:100%; min-width:0; transition:border-color .25s, box-shadow .25s; }
  .field input:focus{ border-color:var(--accent); box-shadow:0 0 0 4px var(--accent-soft); outline:none; }
  .field input::placeholder{ color:var(--faint); }
  .two{ display:grid; grid-template-columns:1fr 1fr; gap:10px; } .three{ display:grid; grid-template-columns:repeat(3,1fr); gap:8px; }
  .chips{ display:flex; gap:6px; flex-wrap:wrap; }
  .chip{ appearance:none; border:1px solid var(--line); background:var(--card); color:var(--sub); font-size:12px; font-weight:700; padding:8px 14px; border-radius:999px; cursor:pointer; transition:background .22s, color .22s, transform .15s; }
  .chip:active{ transform:scale(.94); } .chip.on{ background:var(--accent); color:#fff; border-color:transparent; animation:chipin .4s cubic-bezier(.3,1.6,.5,1); }
  @keyframes chipin{ from{ transform:scale(.88); } }

  /* skeleton shimmer on first visit */
  .sk .b{ display:block; border-radius:9px; background:linear-gradient(90deg, var(--card-2) 25%, var(--line) 50%, var(--card-2) 75%); background-size:200% 100%; animation:shim 1.2s linear infinite; }
  @keyframes shim{ to{ background-position:-200% 0; } }

  /* onboarding + login */
  .hero{ position:relative; height:318px; flex:0 0 auto; overflow:hidden; } .hero svg{ width:100%; height:100%; display:block; }
  .hero::after{ content:""; position:absolute; inset:auto 0 0 0; height:90px; background:linear-gradient(180deg, transparent, var(--screen)); }
  .hero.short{ height:200px; }
  .plane-fly{ animation:fly 11s linear infinite; } @keyframes fly{ from{ transform:translate(-70px,26px); } to{ transform:translate(420px,-34px); } }
  .ship-bob{ animation:bob 4.2s ease-in-out infinite; } @keyframes bob{ 50%{ transform:translateY(-3px) rotate(-.6deg); } }
  .wave{ animation:drift 7s linear infinite; } @keyframes drift{ to{ transform:translateX(-60px); } }
  .cloud{ animation:cdrift 16s ease-in-out infinite alternate; } .cloud.c2{ animation-duration:22s; } .cloud.c3{ animation-duration:19s; animation-direction:alternate-reverse; } @keyframes cdrift{ to{ transform:translateX(38px); } }
  .dashm{ animation:dashm 1.6s linear infinite; } @keyframes dashm{ to{ stroke-dashoffset:-22; } }
  .float{ animation:floaty 5s ease-in-out infinite; } @keyframes floaty{ 50%{ transform:translateY(-9px); } }
  .roadline{ animation:road .7s linear infinite; } @keyframes road{ to{ stroke-dashoffset:-32; } }
  .spin{ animation:spinw .55s linear infinite; transform-box:fill-box; transform-origin:center; } @keyframes spinw{ to{ transform:rotate(360deg); } }
  .mtn{ animation:cdrift 30s ease-in-out infinite alternate; }

  .ob-view{ flex:1; min-height:0; overflow:hidden; position:relative; }
  .ob-track{ display:flex; width:400%; height:100%; transform:translateX(calc(var(--k,0) * -25% * var(--rd,1))); transition:transform .7s cubic-bezier(.22,.9,.24,1); touch-action:pan-y; }
  .ob-slide{ width:25%; flex:0 0 25%; display:flex; flex-direction:column; min-width:0; }
  .ob-slide .txt{ padding:0 22px; display:flex; flex-direction:column; gap:10px; margin-top:-8px; position:relative; z-index:2; }
  .ob-slide .txt > *{ opacity:0; transform:translateY(14px); }
  .ob-slide.on .txt > *{ animation:up .6s cubic-bezier(.2,.8,.2,1) both; animation-delay:calc(var(--n,0) * 80ms + 260ms); }
  .ob-slide h2{ margin:0; font-size:31px; line-height:1.04; letter-spacing:-.02em; font-weight:800; text-wrap:balance; }
  .ob-slide p{ margin:0; font-size:12.5px; line-height:1.5; color:var(--sub); }
  .ob-slide .pill{ align-self:flex-start; }
  .facts{ display:flex; flex-wrap:wrap; gap:6px; } .facts span{ font-size:10.5px; font-weight:700; padding:5px 10px; border-radius:999px; background:var(--card); border:1px solid var(--line); color:var(--sub); }
  .ob-foot{ padding:4px 20px 24px; display:flex; flex-direction:column; gap:16px; flex:0 0 auto; }
  .dots{ display:flex; gap:6px; } .dots i{ width:7px; height:7px; border-radius:6px; background:var(--card-2); transition:width .45s cubic-bezier(.3,1.4,.5,1), background .3s; } .dots i.on{ width:26px; background:var(--accent); }
  .skip{ position:absolute; top:48px; inset-inline-end:16px; z-index:12; border:0; background:rgba(0,0,0,.28); color:#fff; font-size:11.5px; font-weight:800; padding:7px 14px; border-radius:999px; cursor:pointer; backdrop-filter:blur(6px); transition:opacity .3s; }

  .slider{ position:relative; height:58px; border-radius:999px; background:var(--card); border:1px solid var(--line); overflow:hidden; --p:0; --px:0px; user-select:none; -webkit-user-select:none; touch-action:none; }
  .slider .fillbar{ position:absolute; inset-inline-start:0; top:0; bottom:0; width:calc(56px + var(--px)); background:var(--accent-soft); border-radius:999px; }
  .slider .lbl{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center; padding-inline-start:36px; font-size:14px; font-weight:800; opacity:calc(1 - var(--p) * 1.7); pointer-events:none; }
  .slider .chevs{ position:absolute; inset-inline-end:14px; top:0; bottom:0; display:flex; align-items:center; color:var(--faint); pointer-events:none; opacity:calc(1 - var(--p) * 2); }
  .slider .chevs svg{ width:15px; height:15px; margin-inline-start:-6px; animation:wave 1.5s ease-in-out infinite; } .slider .chevs svg:nth-child(2){ animation-delay:.18s; } .slider .chevs svg:nth-child(3){ animation-delay:.36s; }
  @keyframes wave{ 0%,100%{ opacity:.25; transform:translateX(0); } 50%{ opacity:1; transform:translateX(calc(3px * var(--rd,1))); color:var(--accent-text); } }
  .handle{ position:absolute; inset-inline-start:5px; top:5px; width:46px; height:46px; border-radius:50%; background:var(--accent); color:#fff; border:0; display:grid; place-items:center; cursor:grab; box-shadow:0 8px 16px -8px rgba(212,5,17,.7); touch-action:none; transition:transform .55s cubic-bezier(.34,1.5,.5,1); }
  .handle svg{ width:20px; height:20px; }
  .handle::after{ content:""; position:absolute; inset:-3px; border-radius:50%; border:2px solid var(--accent); opacity:0; animation:hring 2.6s ease-out 1.2s infinite; }
  @keyframes hring{ 0%{ transform:scale(.9); opacity:.6; } 60%,100%{ transform:scale(1.5); opacity:0; } }
  .slider:not(.drag):not(.busy) .handle{ animation:hint 2.6s ease-in-out 1.2s infinite; }
  @keyframes hint{ 0%,58%,100%{ transform:none; } 70%{ transform:translateX(calc(18px * var(--rd,1))); } 82%{ transform:translateX(calc(3px * var(--rd,1))); } 91%{ transform:translateX(calc(10px * var(--rd,1))); } }
  .slider.drag .handle, .slider.busy .handle{ cursor:grabbing; } .slider.drag .handle{ transition:none; } .slider.drag .handle::after, .slider.busy .handle::after{ display:none; }

  .ob-ctl{ position:relative; height:58px; }
  .ob-ctl > *{ position:absolute; inset:0; transition:opacity .4s ease, transform .55s cubic-bezier(.22,.9,.24,1); }
  .ob-ctl:not(.first) .slider{ opacity:0; pointer-events:none; transform:translateY(12px) scale(.96); }
  .obnav{ display:flex; gap:10px; } .obnav .btn{ height:58px; } .obnav .ghost{ flex:0 0 38%; width:auto; } .obnav #obNextB{ flex:1; }
  .ob-ctl.first .obnav{ opacity:0; pointer-events:none; transform:translateY(12px) scale(.96); }
  .login-body{ padding:6px 22px 22px; display:flex; flex-direction:column; gap:14px; flex:1; margin-top:-6px; position:relative; z-index:2; }
  .login-body h2{ margin:0; font-size:26px; font-weight:800; letter-spacing:-.02em; } .login-body p{ margin:0; font-size:12.5px; color:var(--sub); }
  .login-body{ gap:11px; padding-bottom:18px; }
  .lhero{ position:absolute; inset:0 0 auto 0; height:236px; background:linear-gradient(165deg,#E3202C 0%,#D40511 45%,#7E0710 100%); overflow:hidden; }
  .lhero .rings i{ position:absolute; inset-inline-end:-70px; top:-60px; width:260px; height:260px; border-radius:50%; border:1.5px solid rgba(255,255,255,.18); animation:ringp 5s ease-in-out infinite; }
  .lhero .rings i:nth-child(2){ inset-inline-end:-30px; top:-20px; width:180px; height:180px; animation-delay:.8s; } .lhero .rings i:nth-child(3){ inset-inline-end:10px; top:20px; width:100px; height:100px; animation-delay:1.6s; }
  @keyframes ringp{ 50%{ transform:scale(1.07); border-color:rgba(255,255,255,.32); } }
  .lhero .wm{ position:absolute; inset-inline-start:24px; top:66px; color:#fff; display:flex; flex-direction:column; gap:2px; }
  .lhero .wm span{ font-size:40px; font-weight:800; letter-spacing:.14em; line-height:1; direction:ltr; } .lhero .wm small{ font-size:12.5px; font-weight:600; opacity:.85; }

  function stars5(v){ return '<span class="pvs">'+STAR+(Math.round(v*10)/10).toFixed(1)+'</span>'; }
  function renderSurveys(){
    var h = '<div class="topbar">'+backBtn()+'<h3>'+t('surveys_ratings')+'</h3></div>';
    h += '<div class="svh"><div class="fs">'+STAR+STAR+STAR+'</div><b>'+t('surveys_ratings')+'</b><p>'+t('surveys_ratings_tagline')+'</p></div>';
    h += '<div class="stag">'+['ship','app'].map(function(k){
      var T = SQ[k], rated = svRecs.some(function(r){ return r.type===k; });
      return '<div class="card svcard" data-sv-start="'+k+'" role="button" tabindex="0"><div class="svr"><div class="mi">'+(k==='ship' ? ico('i-ship') : PHONE)+'</div><div class="g"><b>'+t(T.title)+'</b><small class="s">'+t(T.sub)+'</small></div>'+(rated ? '<span class="pill ok">'+t('survey_status_rated')+'</span>' : '')+'</div>'+
        '<div class="mt">'+(k==='ship' ? '<span class="pill quiet">'+t('survey_shipment_no')+'&nbsp;'+ltr(svDoc())+'</span>' : '')+'<span class="pill quiet">'+CLOCK+t('survey_estimated_time',{'':T.min})+'</span></div>'+
        '<button type="button" class="btn sm">'+t('survey_start')+'</button></div>';
    }).join('')+'</div>';
    h += '<div class="sec"><h4>'+t('survey_previous_ratings')+'</h4></div>';
    if(svRecs.length){
      h += '<div class="stag">'+svRecs.map(function(r){
        return '<div class="card pv"><div class="mi">'+(r.type==='ship' ? ico('i-ship') : PHONE)+'</div><div class="g"><b>'+t(SQ[r.type].title)+'</b><small class="s">'+(r.doc ? ltr(r.doc)+' · ' : '')+fd(r.d[0], r.d[1])+'</small></div>'+stars5(r.avg)+'<span class="pill ok">'+t('survey_status_rated')+'</span></div>';
      }).join('')+'</div>';
    } else {
      h += '<div class="emp"><div class="mi">'+STAR+'</div><span>'+t('survey_previous_empty')+'</span></div>';
    }
    $('#svlBody').innerHTML = h;
  }
  function svOpen(k){ svType = k; svA = {}; svView = 'form'; renderSurvey(); push('survey'); }
  document.addEventListener('click', function(e){
    var el;
    if((el = e.target.closest('[data-sv-start]'))){ svOpen(el.dataset.svStart); return; }
    if((el = e.target.closest('[data-sv]'))){ svView = null; renderSurveys(); push('surveys'); return; }
    if((el = e.target.closest('[data-sv-home]'))){ svView = null; tabTo('home'); return; }
  });
  $('#svBody').addEventListener('click', function(e){
    if(e.target.closest('#svSubmit')){ svSubmit(); return; }
    if(e.target.closest('[data-act]')){ toast(t('sv.t1')); return; }
    var w = e.target.closest('.qw'); if(!w || svView!=='form') return;
    var q = SQ[svType].qs.filter(function(x){ return x.id===w.dataset.q; })[0], b;
    if((b = e.target.closest('.stb'))){ svA[q.id] = +b.dataset.v; b.classList.remove('pop'); void b.offsetWidth; b.classList.add('pop'); }
    else if(e.target.closest('.na')){ svA[q.id] = svA[q.id]==='na' ? undefined : 'na'; }
    else if((b = e.target.closest('.opt'))){
      var o = b.dataset.o;
      if(q.k==='multi'){
        var arr = (svA[q.id]||[]).slice(), i = arr.indexOf(o);
        if(i>-1) arr.splice(i,1); else { if(q.max && arr.length>=q.max){ toast(t('sv.max',{'':q.max})); return; } arr.push(o); }
        svA[q.id] = arr;
      } else svA[q.id] = o;
    } else return;
    $('.qc', w).classList.remove('miss'); svSync();
  });
  $('#svBody').addEventListener('scroll', function(){
    var pr = $('.prog', this); if(!pr) return;
    pr.classList.toggle('stk', pr.getBoundingClientRect().top <= this.getBoundingClientRect().top + 52*0.84);
  });
  $('#svBody').addEventListener('input', function(e){
    var ta = e.target.closest('.ta'); if(!ta) return;
    svA[ta.closest('.qw').dataset.q] = ta.value; svSync();
  });

  /* ---------- home ad banner ---------- */
  L['bn.cta']=['Book now','احجز الآن'];
  L['bn1.tag']=['Offer','عرض'];
  L['bn1.t']=['Sea freight to Umm Qasr','الشحن البحري إلى أم قصر'];
  L['bn1.s']=['Book a container this week and save 12%','احجز حاوية هذا الأسبوع ووفّر 12%'];
  L['bn2.tag']=['New','جديد'];
  L['bn2.t']=['Air express from China','شحن جوي سريع من الصين'];
  L['bn2.s']=['Delivered to Baghdad in 4–6 days','التسليم إلى بغداد خلال 4–6 أيام'];
  L['bn3.tag']=['Land','بري'];
  L['bn3.t']=['Land freight from Dubai','الشحن البري من دبي'];
  L['bn3.s']=['Door-to-door delivery across Iraq','توصيل من الباب إلى الباب داخل العراق'];
  var bnI = 0, bnTm, bnX = null, bnMoved = false;
  function bnGo(i){ bnI = (i+3)%3; $('#bnT').style.setProperty('--bi', bnI); $$('#bnD i').forEach(function(d,k){ d.classList.toggle('on', k===bnI); }); clearInterval(bnTm); bnTm = setInterval(function(){ if(cur==='home') bnGo(bnI+1); }, 4200); }
  $('#bnT').addEventListener('pointerdown', function(e){ bnX = e.clientX; bnMoved = false; });
  $('#bnT').addEventListener('pointerup', function(e){ if(bnX===null) return; var d = (e.clientX-bnX)*(lang?-1:1); if(Math.abs(d)>40){ bnMoved = true; bnGo(bnI + (d<0?1:-1)); } bnX = null; });
  $('#bnT').addEventListener('click', function(e){ if(bnMoved){ e.stopPropagation(); e.preventDefault(); bnMoved = false; } }, true);
  $$('#bnD i').forEach(function(d,k){ d.addEventListener('click', function(){ bnGo(k); }); });
  bnGo(0);

  /* ---------- apply language: text, direction, fonts, dynamic views ---------- */
  function applyLang(){
    var rtl = lang===1;
    root.lang = rtl ? 'ar' : 'en'; scr.dir = rtl ? 'rtl' : 'ltr'; scr.style.setProperty('--rd', rtl ? -1 : 1);
    $$('[data-i18n]').forEach(function(el){ el.innerHTML = t(el.getAttribute('data-i18n')); });
    $$('[data-i18n-ph]').forEach(function(el){ el.setAttribute('placeholder', t(el.getAttribute('data-i18n-ph'))); });
    $$('[data-i18n-aria]').forEach(function(el){ el.setAttribute('aria-label', t(el.getAttribute('data-i18n-aria'))); });
    $$('input[data-dv]').forEach(function(i){ if(!i._d) i.value = t(i.dataset.dv); });
    $$('.seg button[data-lang]').forEach(function(b){ b.setAttribute('aria-pressed', parseInt(b.getAttribute('data-lang'),10)===lang ? 'true':'false'); });
    renderLists();
    if(curDetail) renderDetails(curDetail);
    if(curTrack) renderResult(curTrack);
    renderSurveys(); if(svView==='form') renderSurvey(); else if(svView==='thanks') renderThanks();
    obLabel(); renderBooking();
    if($('#nav').classList.contains('on')){ var ti = TABS.indexOf(cur); if(ti>-1) $('#nav').style.setProperty('--cx', navCx(ti)); }
    thumbs();
  }

  /* ---------- init ---------- */
  initOb(); applyLang(); play(pane('welcome')); $$('.stag', pane('welcome')).forEach(stagger);
  $('#nav').style.setProperty('--cx', navCx(2));
  if(document.fonts && document.fonts.ready) document.fonts.ready.then(thumbs);
  window.addEventListener('resize', thumbs);
})();
</script>
